# This workflow builds the project on every push and pull request to the main branch

name: 'Build and Test'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks out the repository code so the workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v6

      # Sets up the specified Java version required by the project
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Sets up the Gradle for the project
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Runs the main check task to compile, test, and verify the project
      - name: Run Tests & Quality Checks
        run: ./gradlew check

      # Gradle Daemon Cleanup
      - name: Gradle Daemon Cleanup
        if: always()
        run: ./gradlew --stop

  scanning:
    depends_on:
      - build
    runs-on: ubuntu-latest
    name: Analyze (${{ matrix.language }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: kotlin
            build-mode: manual

    steps:
      # Checks out the repository code so the workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v6

      # Sets up the specified Java version required by the project
      - name: Setup JDK 21
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Sets up the Gradle for the project
      - name: Setup Gradle
        if: matrix.language == 'kotlin'
        uses: gradle/actions/setup-gradle@v5

      # Initializes the CodeQL tools for scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Runs the main build and check tasks to compile, test, and verify the project
      - name: Run Tests & Quality Checks
        if: matrix.language == 'kotlin'
        run: ./gradlew build check --no-build-cache

      # Performs CodeQL analysis and uploads the results
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

      # Gradle Daemon Cleanup
      - name: Gradle Daemon Cleanup
        if: always()
        run: ./gradlew --stop
