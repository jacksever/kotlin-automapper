# This workflow creates a tag, publishes to Maven Central, and creates a GitHub Release

name: 'Release: Publish'

on:
  push:
    branches: [ "main" ]

permissions:
  pages: write
  contents: write
  id-token: write

jobs:
  tag-release:
    name: Tag Release
    # This condition ensures the workflow only runs for release merges
    if: contains(github.event.head_commit.message, 'Prepare release of Kotlin AutoMapper')
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      # Checks out the repository with full history to allow branch switching
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Extracts the version number from the release merge commit message
      - name: Extract version from merge commit
        id: get_version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MSG" | sed 's/Prepare release of Kotlin AutoMapper //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Creates and pushes a new Git tag based on the extracted version
      - name: Create and push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.get_version.outputs.version }}"
          git push origin "${{ steps.get_version.outputs.version }}"

  publish-library:
    name: Publish Library
    needs: tag-release
    runs-on: ubuntu-latest

    steps:
      # Checks out the repository code so the workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v6

      # Sets up the specified Java version
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Sets up the Gradle for the project
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      # Publishes the library artifacts to Maven Central
      - name: Publish Artifacts to Maven Central
        run: ./gradlew publishAllPublicationsToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # Creates a GitHub Release associated with the new tag
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: '${{ needs.tag-release.outputs.version }}'
          name: '${{ needs.tag-release.outputs.version }}'
          generateReleaseNotes: true

  deploy-docs:
    name: Deploy Documentation
    needs: [ tag-release, publish-library ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Configures the project for deployment to GitHub Pages
      - name: Configure pages
        uses: actions/configure-pages@v5

      # Checks out the repository code so the workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v6

      # Sets up the specified Python version
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Installs the project dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install zensical

      # Builds the static site using Zensical
      - name: Build documentation
        run: zensical build --clean

      # Uploads the build artifact for GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # Deploys the documentation to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
